<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPLAH Assets</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      color: #334155;
      padding: 20px;
    }
    .box {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 100%;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: 800;
      margin: 0 auto 20px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #0f172a; }
    p { margin: 0 0 20px; color: #64748b; font-size: 14px; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #0f172a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin: 4px;
    }
    a:hover { background: #1e293b; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">S</div>
    <h1>SIPLAH Assets</h1>
    <p>Aset untuk SIPLAH<br>BPS Kabupaten Pacitan</p>
    <a href="favicon.svg" target="_blank">Lihat favicon.svg</a>
  </div>
</body>
</html>
